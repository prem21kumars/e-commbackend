version: '3.9'

networks:
  ecommerce-private:
    driver: bridge
    internal: false

volumes:
  mysql_data:
  mysql_logs:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

services:
  # ===========================================================================
  # 1. MySQL 8.4 Primary Database
  # ===========================================================================
  mysql-primary:
    image: mysql:8.4
    container_name: ecommerce-mysql-primary
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secure_password_2026}
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ${DB_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ecommerce_password_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_logs:/var/log/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - ecommerce-private
    ports:
      - "127.0.0.1:3306:3306" # Bound to localhost only, no public internet exposure
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secure_password_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 24G

  # ===========================================================================
  # 2. Redis 7 In-Memory Cache & Rate Limiting
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "2gb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis_data:/data
    networks:
      - ecommerce-private
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

  # ===========================================================================
  # 3. RabbitMQ Message Broker
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: ecommerce-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-private
    ports:
      - "127.0.0.1:15672:15672" # Management UI on localhost
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ===========================================================================
  # 4. Clustered Spring Boot Instances (Horizontal Scaling for High Concurrency)
  # ===========================================================================
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend-1
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-primary
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-private
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend-2
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-primary
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-private
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  backend-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-backend-3
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-primary
      DB_PORT: 3306
      DB_NAME: ecommerce_db
      DB_USER: ${DB_USER:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-ecommerce_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-placeholder_secret}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-placeholder_webhook_secret}
    depends_on:
      mysql-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-private
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ===========================================================================
  # 5. Nginx Reverse Proxy / Load Balancer
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: ecommerce-nginx
    restart: always
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - ecommerce-private

  # ===========================================================================
  # 6. Observability: Prometheus & Grafana
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ecommerce-prometheus
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - ecommerce-private
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ecommerce-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin_secure_2026}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - ecommerce-private
    ports:
      - "127.0.0.1:3001:3000"

